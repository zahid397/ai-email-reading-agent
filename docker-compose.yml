services:
  postgres:
    image: postgres:16-alpine
    container_name: email_agent_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: email_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d email_agent" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: email_agent_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/email_agent
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama3-8b-8192}
      MOCK_EMAIL_FILE: /app/mock_data/emails.json
      # ব্যাকএন্ড এখন ফ্রন্টএন্ডের রিকোয়েস্ট এক্সেপ্ট করবে
      BACKEND_CORS_ORIGINS: http://localhost:3000,http://localhost:3001
    ports:
      - "8000:8000"
    volumes:
      - ./mock_data:/app/mock_data:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: email_agent_frontend
    depends_on:
      - backend
    environment:
      # Server-side proxy from Next.js API routes → backend container
      RENDER_BACKEND_URL: http://backend:8000
      # Leave NEXT_PUBLIC_BACKEND_URL unset so the browser uses same-origin /api/*
    ports:
      - "3000:3000"

volumes:
  pgdata:
