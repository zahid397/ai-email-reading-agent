services:
  - type: web
    name: ai-email-reading-agent-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Paste your Neon connection string in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      # Optional: set to enable Groq. Empty -> deterministic fallback mode.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama3-8b-8192
      - key: MOCK_EMAIL_FILE
        value: ../mock_data/emails.json
      # Set to your deployed Vercel URL once known.
      - key: BACKEND_CORS_ORIGINS
        value: https://your-frontend.vercel.app
